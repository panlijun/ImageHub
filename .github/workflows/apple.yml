name: Apple verification

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/apple.yml'
      - 'imagehost-new-project-kit/**'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/apple.yml'
      - 'imagehost-new-project-kit/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS arm64 build and verification
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use the runner temporary root for host tools
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify the unchanged input kit
        working-directory: .
        run: node imagehost-new-project-kit/verify-kit.mjs
      - name: Install the exact official Flutter SDK
        run: python3 tool/ci/install_flutter.py
      - name: Inspect Apple tooling
        run: |
          set -euo pipefail
          xcodebuild -version
          flutter doctor -v
          df -h .
      - name: Resolve locked application dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze and verify formatting
        run: |
          set -euo pipefail
          dart tool/versioning.dart check
          flutter analyze
          dart format --output=none --set-exit-if-changed lib test integration_test test_driver tool
          python3 -B -m unittest discover -s tool/ci -p 'test_*.py'
      - name: Run all software tests on the Mac host
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          flutter test --concurrency=2 --reporter=expanded 2>&1 | tee build/ci-evidence/macos-software-tests.log
      - name: Verify independent process recovery and locking
        run: |
          set -euo pipefail
          dart run tool/verify_process_recovery.dart 2>&1 | tee build/ci-evidence/macos-process-recovery.log
      - name: Run Apple native integration verification
        run: |
          set -euo pipefail
          flutter test integration_test/apple_native_smoke_test.dart -d macos --reporter=expanded 2>&1 | tee build/ci-evidence/macos-native-tests.log
      - name: Verify native Mac exports and cross-platform backup restores
        timeout-minutes: 15
        run: |
          set -euo pipefail
          flutter test integration_test/generated_backup_interop_matrix_test.dart -d macos --reporter=expanded 2>&1 | tee build/ci-evidence/macos-backup-interop.log
      - name: Verify native file ownership and real IO with XCTest
        timeout-minutes: 20
        run: |
          set -euo pipefail
          flutter build macos --debug 2>&1 | tee build/ci-evidence/macos-debug-build.log
          xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath build/apple-tests-macos -only-testing:RunnerTests -parallel-testing-enabled NO -resultBundlePath build/ci-evidence/macos-file-tests.xcresult 2>&1 | tee build/ci-evidence/macos-file-tests.log
          python3 tool/ci/verify_apple_file_tests.py build/ci-evidence/macos-file-tests.xcresult --expected 23 --summary build/ci-evidence/macos-file-test-summary.json
      - name: Build the macOS Release application
        run: |
          set -euo pipefail
          flutter build macos --release 2>&1 | tee build/ci-evidence/macos-release-build.log
          python3 tool/ci/verify_apple_versions.py macos build/macos/Build/Products/Release/ImageHub.app --summary build/ci-evidence/macos-native-versions.json
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/ImageHub.app build/ci-evidence/imagehub-macos-arm64.zip
      - name: Retain bounded build and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-arm64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: app/build/ci-evidence/
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS Simulator build and verification
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use the runner temporary root for host tools
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install the exact official Flutter SDK
        run: python3 tool/ci/install_flutter.py
      - name: Resolve locked application dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check independent product versions
        run: dart tool/versioning.dart check
      - name: Create and verify an owned iPhone simulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          python3 tool/ci/boot_ios_simulator.py --runtime com.apple.CoreSimulator.SimRuntime.iOS-26-2 --device-type com.apple.CoreSimulator.SimDeviceType.iPhone-17 2>&1 | tee build/ci-evidence/ios-simulator-boot.log
      - name: Run Apple native integration verification
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          flutter test integration_test/apple_native_smoke_test.dart -d "$IMAGEHOST_IOS_SIMULATOR" --reporter=expanded --verbose 2>&1 | tee build/ci-evidence/ios-simulator-native-tests.log
      - name: Verify native iOS exports and cross-platform backup restores
        timeout-minutes: 15
        run: |
          set -euo pipefail
          flutter test integration_test/generated_backup_interop_matrix_test.dart -d "$IMAGEHOST_IOS_SIMULATOR" --reporter=expanded --verbose 2>&1 | tee build/ci-evidence/ios-backup-interop.log
      - name: Build the iOS Simulator application
        timeout-minutes: 15
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug --no-codesign 2>&1 | tee build/ci-evidence/ios-simulator-build.log
          python3 tool/ci/verify_apple_versions.py ios build/ios/iphonesimulator/Runner.app --summary build/ci-evidence/ios-native-versions.json
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ci-evidence/imagehub-ios-simulator.zip
      - name: Verify a real Photos save with only add permission
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcrun simctl install "$IMAGEHOST_IOS_SIMULATOR" build/ios/iphonesimulator/Runner.app
          python3 tool/ci/boot_ios_simulator.py --photos add-only
          TEST_SIMULATOR=$(python3 -c 'import os, uuid; print(str(uuid.UUID(os.environ["IMAGEHOST_IOS_SIMULATOR"])).upper())')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "platform=iOS Simulator,id=$TEST_SIMULATOR,arch=arm64" -derivedDataPath build/apple-tests-ios -only-testing:RunnerTests/RunnerTests/testITApplePhotosRealAddOnlyCommitPreservesSourceAndRetiresStage -parallel-testing-enabled NO -resultBundlePath build/ci-evidence/ios-photos-add-only.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci-evidence/ios-photos-add-only.log
          python3 tool/ci/verify_apple_file_tests.py build/ci-evidence/ios-photos-add-only.xcresult --expected 1 --summary build/ci-evidence/ios-photos-add-only-summary.json
      - name: Verify native IO and exact synthetic Photos resource readback
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 tool/ci/boot_ios_simulator.py --photos read-write
          TEST_SIMULATOR=$(python3 -c 'import os, uuid; print(str(uuid.UUID(os.environ["IMAGEHOST_IOS_SIMULATOR"])).upper())')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "platform=iOS Simulator,id=$TEST_SIMULATOR,arch=arm64" -derivedDataPath build/apple-tests-ios -only-testing:RunnerTests -parallel-testing-enabled NO -resultBundlePath build/ci-evidence/ios-file-tests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci-evidence/ios-file-tests.log
          python3 tool/ci/verify_apple_file_tests.py build/ci-evidence/ios-file-tests.xcresult --expected 27 --summary build/ci-evidence/ios-file-test-summary.json
      - name: Clean up only the confirmed owned simulator
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          python3 tool/ci/boot_ios_simulator.py --cleanup 2>&1 | tee build/ci-evidence/ios-simulator-cleanup.log
      - name: Retain bounded build and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-simulator-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: app/build/ci-evidence/
          if-no-files-found: warn
          retention-days: 7
